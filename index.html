<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Электронный дневник • 1 урок в неделю</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white" x-data="diaryApp" x-cloak>

    <!-- Toast Notifications Container -->
    <div class="fixed bottom-5 right-5 z-50 space-y-2 max-w-sm w-full px-4">
        <template x-for="toast in toasts" :key="toast.id">
            <div :class="{
                'bg-emerald-600 text-white': toast.type === 'success',
                'bg-rose-600 text-white': toast.type === 'error',
                'bg-sky-600 text-white': toast.type === 'info'
            }" class="px-4 py-3 rounded-xl shadow-lg flex items-center justify-between transition transform duration-300">
                <span class="text-sm font-medium" x-text="toast.message"></span>
                <button @click="toasts = toasts.filter(t => t.id !== toast.id)" class="ml-3 text-white hover:opacity-75 focus:outline-none">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </template>
    </div>

    <!-- MAIN WRAPPER -->
    <div class="flex-grow flex flex-col">

        <!-- AUTHENTICATION VIEW -->
        <template x-if="!currentUser">
            <div class="flex-grow flex items-center justify-center p-4 bg-gradient-to-br from-indigo-900 via-slate-900 to-purple-950">
                <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 max-w-md w-full border border-white/20">
                    <div class="text-center mb-8">
                        <div class="w-16 h-16 bg-indigo-600 text-white rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-lg shadow-indigo-500/30 mb-4">
                            <i class="fa-solid fa-graduation-cap"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-slate-900">Электронный Дневник</h1>
                        <p class="text-slate-500 text-sm mt-1">Дисциплина: 1 урок в неделю</p>
                    </div>

                    <!-- Login Form -->
                    <form @submit.prevent="login(loginUsername, loginPassword)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Логин</label>
                            <input type="text" x-model="loginUsername" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition text-sm bg-slate-50/50" placeholder="Введите логин...">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">Пароль</label>
                            <input type="password" x-model="loginPassword" required class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 outline-none transition text-sm bg-slate-50/50" placeholder="••••••••">
                        </div>

                        <template x-if="loginError">
                            <p class="text-rose-600 text-xs font-medium bg-rose-50 p-2.5 rounded-lg text-center" x-text="loginError"></p>
                        </p>
                        </template>

                        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition transform active:scale-[0.99] text-sm">
                            Войти в систему
                        </button>
                    </form>

                    <!-- Quick Demo Accounts -->
                    <div class="mt-8 pt-6 border-t border-slate-100">
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider text-center mb-3">Демо-аккаунты в один клик</p>
                        <div class="grid grid-cols-3 gap-2">
                            <button @click="quickLogin('owner')" class="px-3 py-2 text-xs font-medium rounded-lg bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200 transition text-center">
                                <div class="font-bold">Владелец</div>
                                <div class="text-[10px] opacity-75">owner</div>
                            </button>
                            <button @click="quickLogin('teacher')" class="px-3 py-2 text-xs font-medium rounded-lg bg-blue-50 text-blue-700 hover:bg-blue-100 border border-blue-200 transition text-center">
                                <div class="font-bold">Учитель</div>
                                <div class="text-[10px] opacity-75">teacher</div>
                            </button>
                            <button @click="quickLogin('student')" class="px-3 py-2 text-xs font-medium rounded-lg bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 transition text-center">
                                <div class="font-bold">Ученик</div>
                                <div class="text-[10px] opacity-75">student</div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- DASHBOARD VIEW -->
        <template x-if="currentUser">
            <div class="flex-grow flex flex-col">
                <!-- TOP NAVBAR -->
                <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-md shadow-indigo-500/20">
                                <i class="fa-solid fa-book-open"></i>
                            </div>
                            <div>
                                <span class="font-bold text-slate-900 text-lg">Электронный Дневник</span>
                                <span class="hidden sm:inline-block ml-2 text-xs font-semibold px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-600">1 урок в неделю</span>
                            </div>
                        </div>

                        <!-- User Info & Logout -->
                        <div class="flex items-center space-x-4">
                            <div class="text-right hidden sm:block">
                                <div class="text-sm font-semibold text-slate-900" x-text="currentUser.fullName"></div>
                                <div class="text-xs font-medium text-indigo-600 uppercase tracking-wide" x-text="{ 'owner': 'Владелец системы', 'teacher': 'Преподаватель', 'student': 'Ученик' }[currentUser.role]"></div>
                            </div>
                            <button @click="logout" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 text-sm font-medium transition flex items-center space-x-2">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                <span class="hidden md:inline">Выйти</span>
                            </button>
                        </div>
                    </div>

                    <!-- TAB NAVIGATION -->
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-6 overflow-x-auto">
                        <button @click="currentTab = 'schedule'" :class="currentTab === 'schedule' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'" class="py-3 border-b-2 font-medium text-sm flex items-center space-x-2 whitespace-nowrap transition">
                            <i class="fa-solid fa-calendar-days"></i>
                            <span>Расписание и ДЗ</span>
                        </button>
                        <button @click="currentTab = 'grades'" :class="currentTab === 'grades' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'" class="py-3 border-b-2 font-medium text-sm flex items-center space-x-2 whitespace-nowrap transition">
                            <i class="fa-solid fa-chart-line"></i>
                            <span>Оценки и успеваемость</span>
                        </button>
                        <template x-if="currentUser.role === 'owner'">
                            <button @click="currentTab = 'admin_schedule'" :class="currentTab === 'admin_schedule' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'" class="py-3 border-b-2 font-medium text-sm flex items-center space-x-2 whitespace-nowrap transition">
                                <i class="fa-solid fa-gears"></i>
                                <span>Управление расписанием</span>
                            </button>
                        </template>
                        <template x-if="currentUser.role === 'owner'">
                            <button @click="currentTab = 'admin_users'" :class="currentTab === 'admin_users' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'" class="py-3 border-b-2 font-medium text-sm flex items-center space-x-2 whitespace-nowrap transition">
                                <i class="fa-solid fa-users-gear"></i>
                                <span>Управление пользователями</span>
                            </button>
                        </template>
                    </div>
                </header>

                <!-- MAIN CONTENT AREA -->
                <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

                    <!-- TAB 1: SCHEDULE & HOMEWORK -->
                    <div x-show="currentTab === 'schedule'" class="space-y-6">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                            <div>
                                <h2 class="text-2xl font-bold text-slate-900">Расписание занятий</h2>
                                <p class="text-sm text-slate-500">Занятия проводятся еженедельно (1 раз в неделю — каждый вторник)</p>
                            </div>
                            <template x-if="currentUser.role === 'owner'">
                                <button @click="addLesson()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium shadow-md shadow-indigo-600/20 transition flex items-center space-x-2 self-start">
                                    <i class="fa-solid fa-plus"></i>
                                    <span>Добавить урок</span>
                                </button>
                            </template>
                        </div>

                        <!-- Lessons List Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <template x-for="lesson in lessons" :key="lesson.id">
                                <div @click="openLessonModal(lesson)" class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-md hover:border-indigo-300 transition cursor-pointer flex flex-col justify-between group relative overflow-hidden">
                                    <div class="absolute top-0 left-0 w-1.5 h-full bg-indigo-500 group-hover:bg-indigo-600 transition"></div>
                                    <div>
                                        <div class="flex items-center justify-between text-xs font-semibold text-indigo-600 mb-2">
                                            <span class="bg-indigo-50 px-2.5 py-1 rounded-lg" x-text="`Урок №` + lesson.weekNum"></span>
                                            <span class="text-slate-500" x-text="lesson.date"></span>
                                        </div>
                                        <h3 class="text-lg font-bold text-slate-900 group-hover:text-indigo-600 transition mb-1" x-text="lesson.topic"></h3>
                                        <div class="flex items-center text-xs text-slate-500 space-x-3 mb-4">
                                            <span><i class="fa-regular fa-clock mr-1"></i> <span x-text="lesson.time"></span></span>
                                            <span><i class="fa-solid fa-location-dot mr-1"></i> <span x-text="lesson.room"></span></span>
                                        </div>
                                    </div>
                                    <div class="pt-4 border-t border-slate-100 flex items-center justify-between text-xs">
                                        <div class="text-slate-600 truncate pr-2">
                                            <span class="font-semibold">ДЗ:</span> <span x-text="lesson.homework || 'Не задано'"></span>
                                        </div>
                                        <span class="text-indigo-600 font-medium group-hover:translate-x-1 transition flex-shrink-0">Подробнее <i class="fa-solid fa-arrow-right ml-1"></i></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- TAB 2: GRADES & PERFORMANCE -->
                    <div x-show="currentTab === 'grades'" class="space-y-6">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                            <div>
                                <h2 class="text-2xl font-bold text-slate-900">Журнал успеваемости</h2>
                                <p class="text-sm text-slate-500">Обычные оценки, предварительные «оценки с точкой» и ежемесячные итоги</p>
                            </div>
                            <template x-if="currentUser.role === 'teacher' || currentUser.role === 'owner'">
                                <button @click="openGradeModal(getStudents()[0] ? getStudents()[0].id : '')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium shadow-md shadow-indigo-600/20 transition flex items-center space-x-2 self-start">
                                    <i class="fa-solid fa-star"></i>
                                    <span>Выставить оценку</span>
                                </button>
                            </template>
                        </div>

                        <!-- Grades Table -->
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                            <th class="py-4 px-6">Ученик</th>
                                            <th class="py-4 px-6">Оценки по урокам (1 раз в неделю)</th>
                                            <th class="py-4 px-6 text-center">Итог за месяц</th>
                                            <template x-if="currentUser.role === 'teacher' || currentUser.role === 'owner'">
                                                <th class="py-4 px-6 text-right">Действия</th>
                                            </template>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100 text-sm">
                                        <template x-for="student in getStudents()" :key="student.id">
                                            <tr class="hover:bg-slate-50/50 transition">
                                                <td class="py-4 px-6 font-semibold text-slate-900" x-text="student.fullName"></td>
                                                <td class="py-4 px-6">
                                                    <div class="flex flex-wrap gap-2 items-center">
                                                        <template x-for="grade in getStudentGrades(student.id)" :key="grade.id">
                                                            <div class="group relative inline-flex items-center">
                                                                <span :class="{
                                                                    'bg-emerald-100 text-emerald-800 border-emerald-300': grade.value.includes('5'),
                                                                    'bg-blue-100 text-blue-800 border-blue-300': grade.value.includes('4') && !grade.isProvisional,
                                                                    'bg-amber-100 text-amber-800 border-amber-300': grade.value.includes('3') || grade.isProvisional,
                                                                    'bg-rose-100 text-rose-800 border-rose-300': grade.value.includes('2')
                                                                }" class="px-3 py-1.5 rounded-xl border text-sm font-bold shadow-xs flex items-center space-x-1">
                                                                    <span x-text="grade.value"></span>
                                                                    <template x-if="grade.isProvisional">
                                                                        <span class="text-[10px] bg-amber-200 text-amber-900 px-1 rounded ml-1" title="Предварительная оценка с точкой">пред.</span>
                                                                    </template>
                                                                </span>

                                                                <!-- Grade actions dropdown on hover or click -->
                                                                <template x-if="currentUser.role === 'owner' || canEditGrade(grade)">
                                                                    <div class="absolute -top-3 right-0 hidden group-hover:flex items-center space-x-1 bg-white shadow-md border border-slate-200 rounded-lg p-0.5 z-10">
                                                                        <template x-if="grade.isProvisional">
                                                                            <button @click="convertToValid(grade.id)" title="Утвердить оценку" class="p-1 hover:bg-emerald-50 text-emerald-600 rounded">
                                                                                <i class="fa-solid fa-check text-xs"></i>
                                                                            </button>
                                                                        </template>
                                                                        <button @click="editExistingGrade(grade)" title="Редактировать" class="p-1 hover:bg-indigo-50 text-indigo-600 rounded">
                                                                            <i class="fa-solid fa-pen text-xs"></i>
                                                                        </button>
                                                                        <button @click="deleteGrade(grade.id)" title="Удалить" class="p-1 hover:bg-rose-50 text-rose-600 rounded">
                                                                            <i class="fa-solid fa-trash text-xs"></i>
                                                                        </button>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </template>
                                                        <template x-if="getStudentGrades(student.id).length === 0">
                                                            <span class="text-slate-400 italic text-xs">Нет оценок</span>
                                                        </template>
                                                    </div>
                                                </td>
                                                <td class="py-4 px-6 text-center font-bold text-slate-800">
                                                    <div class="inline-block bg-indigo-50 text-indigo-700 px-3 py-1 rounded-xl text-sm border border-indigo-100" x-text="getStudentFinal(student.id)"></div>
                                                </td>
                                                <template x-if="currentUser.role === 'teacher' || currentUser.role === 'owner'">
                                                    <td class="py-4 px-6 text-right space-x-2">
                                                        <button @click="openGradeModal(student.id)" class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-xl text-xs font-semibold transition">
                                                            <i class="fa-solid fa-plus mr-1"></i> Оценка
                                                        </button>
                                                        <template x-if="currentUser.role === 'owner' || currentUser.role === 'teacher'">
                                                            <button @click="let val = prompt('Введите итоговую оценку за месяц (например, 5, 4):', getStudentFinal(student.id)); if(val) saveFinalGrade(student.id, val);" class="px-3 py-1.5 bg-purple-50 hover:bg-purple-100 text-purple-600 rounded-xl text-xs font-semibold transition">
                                                                Итог
                                                            </button>
                                                        </template>
                                                    </td>
                                                </template>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 3: ADMIN SCHEDULE MANAGEMENT (OWNER ONLY) -->
                    <template x-if="currentUser.role === 'owner'">
                        <div x-show="currentTab === 'admin_schedule'" class="space-y-6">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h2 class="text-2xl font-bold text-slate-900">Управление расписанием</h2>
                                    <p class="text-sm text-slate-500">Настройка тем уроков, кабинетов и дней недели</p>
                                </div>
                                <button @click="addLesson()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium shadow-md shadow-indigo-600/20 transition flex items-center space-x-2">
                                    <i class="fa-solid fa-plus"></i>
                                    <span>Добавить урок</span>
                                </button>
                            </div>

                            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                <div class="divide-y divide-slate-100">
                                    <template x-for="lesson in lessons" :key="lesson.id">
                                        <div class="p-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                                            <div class="space-y-2 flex-grow w-full md:w-auto">
                                                <div class="flex items-center space-x-3">
                                                    <span class="px-2.5 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-lg" x-text="`Урок №` + lesson.weekNum"></span>
                                                    <input type="date" x-model="lesson.date" @change="updateScheduleItem(lesson)" class="px-3 py-1.5 border border-slate-200 rounded-lg text-xs font-medium focus:border-indigo-500 outline-none">
                                                    <input type="text" x-model="lesson.dayOfWeek" @change="updateScheduleItem(lesson)" class="px-3 py-1.5 border border-slate-200 rounded-lg text-xs font-medium focus:border-indigo-500 outline-none w-28" placeholder="День недели">
                                                </div>
                                                <input type="text" x-model="lesson.topic" @change="updateScheduleItem(lesson)" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 focus:border-indigo-500 outline-none" placeholder="Тема урока">
                                                <div class="flex items-center space-x-3">
                                                    <input type="text" x-model="lesson.room" @change="updateScheduleItem(lesson)" class="px-3 py-1.5 border border-slate-200 rounded-lg text-xs font-medium focus:border-indigo-500 outline-none w-36" placeholder="Кабинет">
                                                    <input type="text" x-model="lesson.time" @change="updateScheduleItem(lesson)" class="px-3 py-1.5 border border-slate-200 rounded-lg text-xs font-medium focus:border-indigo-500 outline-none w-36" placeholder="Время">
                                                </div>
                                            </div>
                                            <div class="flex items-center space-x-2 self-end md:self-center">
                                                <button @click="deleteLesson(lesson.id)" class="px-3.5 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs font-semibold transition">
                                                    <i class="fa-solid fa-trash mr-1"></i> Удалить
                                                </button>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>

                    <!-- TAB 4: ADMIN USERS MANAGEMENT (OWNER ONLY) -->
                    <template x-if="currentUser.role === 'owner'">
                        <div x-show="currentTab === 'admin_users'" class="space-y-6">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h2 class="text-2xl font-bold text-slate-900">Управление пользователями и ролями</h2>
                                    <p class="text-sm text-slate-500">Назначение ролей Владельца, Учителя или Ученика</p>
                                </div>
                                <button @click="addUser()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-medium shadow-md shadow-indigo-600/20 transition flex items-center space-x-2">
                                    <i class="fa-solid fa-user-plus"></i>
                                    <span>Добавить пользователя</span>
                                </button>
                            </div>

                            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left border-collapse">
                                        <thead>
                                            <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                                <th class="py-4 px-6">ФИО / Логин</th>
                                                <th class="py-4 px-6">Роль</th>
                                                <th class="py-4 px-6">Группа / Класс</th>
                                                <th class="py-4 px-6 text-right">Действия</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-100 text-sm">
                                            <template x-for="user in users" :key="user.id">
                                                <tr class="hover:bg-slate-50/50 transition">
                                                    <td class="py-4 px-6">
                                                        <div class="font-bold text-slate-900" x-text="user.fullName"></div>
                                                        <div class="text-xs text-slate-400" x-text="`@` + user.username"></div>
                                                    </td>
                                                    <td class="py-4 px-6">
                                                        <select @change="changeUserRole(user, $event.target.value)" class="px-3 py-1.5 border border-slate-200 rounded-xl text-xs font-semibold focus:border-indigo-500 outline-none bg-slate-50">
                                                            <option value="student" :selected="user.role === 'student'">Ученик</option>
                                                            <option value="teacher" :selected="user.role === 'teacher'">Учитель</option>
                                                            <option value="owner" :selected="user.role === 'owner'">Владелец</option>
                                                        </select>
                                                    </td>
                                                    <td class="py-4 px-6 text-slate-600" x-text="user.group || '—'"></td>
                                                    <td class="py-4 px-6 text-right">
                                                        <button @click="deleteUser(user.id)" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs font-semibold transition">
                                                            <i class="fa-solid fa-trash mr-1"></i> Удалить
                                                        </button>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </template>

                </main>

                <!-- FOOTER -->
                <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400 mt-12">
                    <p>Электронный дневник • Работает полностью на клиентской части (GitHub Pages & localStorage)</p>
                </footer>
            </div>
        </template>

    </div>

    <!-- MODAL: LESSON DETAILS & HOMEWORK -->
    <div x-show="showLessonModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm" x-cloak>
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-6 border border-slate-100 space-y-6" @click.outside="showLessonModal = false">
            <div class="flex items-center justify-between">
                <div>
                    <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-lg" x-text="selectedLesson ? `Урок №` + selectedLesson.weekNum : ''"></span>
                    <span class="text-xs text-slate-400 ml-2" x-text="selectedLesson ? selectedLesson.date : ''"></span>
                </div>
                <button @click="showLessonModal = false" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <template x-if="selectedLesson">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Тема урока</label>
                        <template x-if="canEditLesson">
                            <input type="text" x-model="hwEditTopic" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm font-bold text-slate-900">
                        </template>
                        <template x-if="!canEditLesson">
                            <h3 class="text-xl font-bold text-slate-900" x-text="selectedLesson.topic"></h3>
                        </template>
                    </div>

                    <div class="grid grid-cols-2 gap-4 text-xs">
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <span class="text-slate-400 block mb-0.5 font-semibold">Время</span>
                            <span class="font-bold text-slate-800" x-text="selectedLesson.time"></span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                            <span class="text-slate-400 block mb-0.5 font-semibold">Кабинет</span>
                            <span class="font-bold text-slate-800" x-text="selectedLesson.room"></span>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Домашнее задание</label>
                        <template x-if="canEditLesson">
                            <textarea rows="3" x-model="hwEditText" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm text-slate-800" placeholder="Введите описание домашнего задания..."></textarea>
                        </template>
                        <template x-if="!canEditLesson">
                            <div class="p-4 bg-indigo-50/50 border border-indigo-100 rounded-xl text-sm text-slate-700" x-text="selectedLesson.homework || 'Домашнее задание не задано'"></div>
                        </template>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Срок сдачи ДЗ</label>
                        <template x-if="canEditLesson">
                            <input type="date" x-model="hwEditDeadline" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm text-slate-800">
                        </template>
                        <template x-if="!canEditLesson">
                            <div class="text-sm font-medium text-slate-700" x-text="selectedLesson.homeworkDeadline || 'Не указан'"></div>
                        </template>
                    </div>
                </div>
            </template>

            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100">
                <button @click="showLessonModal = false" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm font-medium transition">Закрыть</button>
                <template x-if="canEditLesson">
                    <button @click="saveHomework()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold shadow-md shadow-indigo-600/20 transition">Сохранить</button>
                </template>
            </div>
        </div>
    </div>

    <!-- MODAL: ADD / EDIT GRADE -->
    <div x-show="showGradeModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm" x-cloak>
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border border-slate-100 space-y-6" @click.outside="showGradeModal = false">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-bold text-slate-950" x-text="editingGradeId ? 'Редактировать оценку' : 'Выставить оценку'"></h3>
                <button @click="showGradeModal = false" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Ученик</label>
                    <select x-model="gradeStudentId" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm bg-slate-50 font-medium">
                        <template x-for="student in getStudents()" :key="student.id">
                            <option :value="student.id" x-text="student.fullName"></option>
                        </template>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Урок</label>
                    <select x-model="gradeLessonId" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm bg-slate-50 font-medium">
                        <template x-for="lesson in lessons" :key="lesson.id">
                            <option :value="lesson.id" x-text="`Урок №` + lesson.weekNum + ` — ` + lesson.topic"></option>
                        </template>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Оценка</label>
                    <div class="grid grid-cols-4 gap-2">
                        <template x-for="val in ['2', '3', '4', '5']">
                            <button type="button" @click="gradeValue = val" :class="gradeValue === val ? 'bg-indigo-600 text-white font-bold shadow-md shadow-indigo-600/30' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'" class="py-2.5 rounded-xl text-sm transition" x-text="val"></button>
                        </template>
                    </div>
                </div>

                <div class="flex items-center space-x-3 pt-2">
                    <input type="checkbox" id="provisionalCheck" x-model="gradeIsProvisional" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                    <label for="provisionalCheck" class="text-sm font-medium text-slate-700">Оценка с точкой (предварительная, например <span class="font-bold">4.</span>)</label>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Комментарий / Примечание</label>
                    <input type="text" x-model="gradeComment" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-indigo-500 outline-none text-sm bg-slate-50" placeholder="Например: За активную работу на уроке">
                </div>
            </div>

            <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-100">
                <button @click="showGradeModal = false" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm font-medium transition">Отмена</button>
                <button @click="saveGrade()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold shadow-md shadow-indigo-600/20 transition">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Alpine App Logic -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('diaryApp', () => ({
                currentTab: 'schedule',
                currentUser: null,
                users: [],
                lessons: [],
                grades: [],
                finalGrades: [],
                
                loginUsername: '',
                loginPassword: '',
                loginError: '',

                selectedLesson: null,
                showLessonModal: false,
                hwEditTopic: '',
                hwEditText: '',
                hwEditDeadline: '',

                showGradeModal: false,
                gradeStudentId: '',
                gradeLessonId: '',
                gradeValue: '5',
                gradeIsProvisional: false,
                gradeComment: '',
                editingGradeId: null,

                toasts: [],

                init() {
                    this.loadInitialData();
                    const savedUser = localStorage.getItem('diary_current_user');
                    if (savedUser) {
                        try {
                            this.currentUser = JSON.parse(savedUser);
                        } catch(e) {
                            this.currentUser = null;
                        }
                    }
                },

                loadInitialData() {
                    let defaultUsers = [
                        { id: 'u1', username: 'owner', password: 'owner123', role: 'owner', fullName: 'Александр Владельцев (Админ)', group: 'Администрация' },
                        { id: 'u2', username: 'teacher', password: 'teacher123', role: 'teacher', fullName: 'Елена Сергеевна (Учитель)', group: 'Преподаватели' },
                        { id: 'u3', username: 'student', password: 'student123', role: 'student', fullName: 'Иван Петров (Ученик)', group: '10-А класс' },
                        { id: 'u4', username: 'student2', password: 'student123', role: 'student', fullName: 'Анна Смирнова (Ученик)', group: '10-А класс' }
                    ];
                    let storedUsers = localStorage.getItem('diary_users');
                    this.users = storedUsers ? JSON.parse(storedUsers) : defaultUsers;
                    if (!storedUsers) localStorage.setItem('diary_users', JSON.stringify(this.users));

                    let defaultLessons = [
                        { id: 'l1', weekNum: 1, date: '2026-09-01', dayOfWeek: 'Вторник', time: '10:00 - 10:45', topic: 'Введение в веб-разработку и GitHub Pages', room: 'Кабинет 305', homework: 'Повторить основные понятия HTML и CSS.', homeworkDeadline: '2026-09-08' },
                        { id: 'l2', weekNum: 2, date: '2026-09-08', dayOfWeek: 'Вторник', time: '10:00 - 10:45', topic: 'Основы клиентской части (Client-side) и LocalStorage', room: 'Кабинет 305', homework: 'Написать простой скрипт сохранения данных в localStorage.', homeworkDeadline: '2026-09-15' },
                        { id: 'l3', weekNum: 3, date: '2026-09-15', dayOfWeek: 'Вторник', time: '10:00 - 10:45', topic: 'Системы контроля версий и деплой на GitHub', room: 'Кабинет 305', homework: 'Создать репозиторий на GitHub и активировать Pages.', homeworkDeadline: '2026-09-22' },
                        { id: 'l4', weekNum: 4, date: '2026-09-22', dayOfWeek: 'Вторник', time: '10:00 - 10:45', topic: 'Интерактивные интерфейсы на Tailwind CSS и JS', room: 'Кабинет 305', homework: 'Сверстать карточку профиля с адаптивным дизайном.', homeworkDeadline: '2026-09-29' },
                        { id: 'l5', weekNum: 5, date: '2026-09-29', dayOfWeek: 'Вторник', time: '10:00 - 10:45', topic: 'Месячное подведение итогов и защита проектов', room: 'Кабинет 305', homework: 'Подготовить отчет о проделанной работе за месяц.', homeworkDeadline: '2026-10-06' }
                    ];
                    let storedLessons = localStorage.getItem('diary_lessons');
                    this.lessons = storedLessons ? JSON.parse(storedLessons) : defaultLessons;
                    if (!storedLessons) localStorage.setItem('diary_lessons', JSON.stringify(this.lessons));

                    let defaultGrades = [
                        { id: 'g1', studentId: 'u3', lessonId: 'l1', value: '5', isProvisional: false, teacherId: 'u2', teacherName: 'Елена Сергеевна', dateIssued: '2026-09-02', comment: 'Отличный старт!' },
                        { id: 'g2', studentId: 'u3', lessonId: 'l2', value: '4.', isProvisional: true, teacherId: 'u2', teacherName: 'Елена Сергеевна', dateIssued: '2026-09-09', comment: 'Ждем доработку ДЗ' },
                        { id: 'g3', studentId: 'u4', lessonId: 'l1', value: '4', isProvisional: false, teacherId: 'u2', teacherName: 'Елена Сергеевна', dateIssued: '2026-09-02', comment: 'Хорошая работа' }
                    ];
                    let storedGrades = localStorage.getItem('diary_grades');
                    this.grades = storedGrades ? JSON.parse(storedGrades) : defaultGrades;
                    if (!storedGrades) localStorage.setItem('diary_grades', JSON.stringify(this.grades));

                    let defaultFinalGrades = [
                        { studentId: 'u3', month: 'Сентябрь 2026', grade: '5' },
                        { studentId: 'u4', month: 'Сентябрь 2026', grade: '4' }
                    ];
                    let storedFinal = localStorage.getItem('diary_final_grades');
                    this.finalGrades = storedFinal ? JSON.parse(storedFinal) : defaultFinalGrades;
                    if (!storedFinal) localStorage.setItem('diary_final_grades', JSON.stringify(this.finalGrades));
                },

                saveData() {
                    localStorage.setItem('diary_users', JSON.stringify(this.users));
                    localStorage.setItem('diary_lessons', JSON.stringify(this.lessons));
                    localStorage.setItem('diary_grades', JSON.stringify(this.grades));
                    localStorage.setItem('diary_final_grades', JSON.stringify(this.finalGrades));
                },

                login(username, password) {
                    const found = this.users.find(u => u.username === username && u.password === password);
                    if (found) {
                        this.currentUser = found;
                        localStorage.setItem('diary_current_user', JSON.stringify(found));
                        this.loginError = '';
                        this.showToast(`Добро пожаловать, ${found.fullName}!`, 'success');
                    } else {
                        this.loginError = 'Неверный логин или пароль';
                    }
                },

                quickLogin(role) {
                    const demoMap = {
                        'owner': { u: 'owner', p: 'owner123' },
                        'teacher': { u: 'teacher', p: 'teacher123' },
                        'student': { u: 'student', p: 'student123' }
                    };
                    if (demoMap[role]) {
                        this.login(demoMap[role].u, demoMap[role].p);
                    }
                },

                logout() {
                    this.currentUser = null;
                    localStorage.removeItem('diary_current_user');
                    this.showToast('Вы вышли из системы', 'info');
                },

                showToast(message, type = 'success') {
                    const id = Date.now();
                    this.toasts.push({ id, message, type });
                    setTimeout(() => {
                        this.toasts = this.toasts.filter(t => t.id !== id);
                    }, 4000);
                },

                openLessonModal(lesson) {
                    this.selectedLesson = lesson;
                    this.hwEditTopic = lesson.topic;
                    this.hwEditText = lesson.homework;
                    this.hwEditDeadline = lesson.homeworkDeadline;
                    this.showLessonModal = true;
                },

                saveHomework() {
                    if (!this.canEditLesson) return;
                    this.selectedLesson.topic = this.hwEditTopic;
                    this.selectedLesson.homework = this.hwEditText;
                    this.selectedLesson.homeworkDeadline = this.hwEditDeadline;
                    this.saveData();
                    this.showLessonModal = false;
                    this.showToast('Домашнее задание успешно обновлено!', 'success');
                },

                get canEditLesson() {
                    return this.currentUser && (this.currentUser.role === 'owner' || this.currentUser.role === 'teacher');
                },

                openGradeModal(studentId, lessonId = null) {
                    this.gradeStudentId = studentId;
                    this.gradeLessonId = lessonId || (this.lessons[0] ? this.lessons[0].id : '');
                    this.gradeValue = '5';
                    this.gradeIsProvisional = false;
                    this.gradeComment = '';
                    this.editingGradeId = null;
                    this.showGradeModal = true;
                },

                editExistingGrade(grade) {
                    if (!this.canEditGrade(grade)) {
                        this.showToast('Вы не можете редактировать эту оценку (прошло более недели или она выставлена другим преподавателем)', 'error');
                        return;
                    }
                    this.editingGradeId = grade.id;
                    this.gradeStudentId = grade.studentId;
                    this.gradeLessonId = grade.lessonId;
                    this.gradeValue = grade.value.replace('.', '');
                    this.gradeIsProvisional = grade.isProvisional;
                    this.gradeComment = grade.comment || '';
                    this.showGradeModal = true;
                },

                canEditGrade(grade) {
                    if (!this.currentUser) return false;
                    if (this.currentUser.role === 'owner') return true;
                    if (this.currentUser.role === 'teacher') {
                        if (grade.teacherId !== this.currentUser.id) return false;
                        const issuedDate = new Date(grade.dateIssued);
                        const now = new Date();
                        const diffDays = (now - issuedDate) / (1000 * 60 * 60 * 24);
                        return diffDays <= 7;
                    }
                    return false;
                },

                saveGrade() {
                    const finalVal = this.gradeIsProvisional ? this.gradeValue + '.' : this.gradeValue;
                    const today = new Date().toISOString().split('T')[0];

                    if (this.editingGradeId) {
                        const g = this.grades.find(item => item.id === this.editingGradeId);
                        if (g) {
                            g.value = finalVal;
                            g.isProvisional = this.gradeIsProvisional;
                            g.comment = this.gradeComment;
                            this.showToast('Оценка успешно обновлена', 'success');
                        }
                    } else {
                        const newG = {
                            id: 'g_' + Date.now(),
                            studentId: this.gradeStudentId,
                            lessonId: this.gradeLessonId,
                            value: finalVal,
                            isProvisional: this.gradeIsProvisional,
                            teacherId: this.currentUser.id,
                            teacherName: this.currentUser.fullName,
                            dateIssued: today,
                            comment: this.gradeComment
                        };
                        this.grades.push(newG);
                        this.showToast('Оценка успешно выставлена', 'success');
                    }
                    this.saveData();
                    this.showGradeModal = false;
                },

                deleteGrade(gradeId) {
                    const grade = this.grades.find(g => g.id === gradeId);
                    if (!grade) return;
                    if (this.currentUser.role !== 'owner' && !this.canEditGrade(grade)) {
                        this.showToast('Недостаточно прав для удаления оценки', 'error');
                        return;
                    }
                    this.grades = this.grades.filter(g => g.id !== gradeId);
                    this.saveData();
                    this.showToast('Оценка удалена', 'info');
                },

                convertToValid(gradeId) {
                    const grade = this.grades.find(g => g.id === gradeId);
                    if (!grade) return;
                    if (!this.canEditGrade(grade) && this.currentUser.role !== 'owner') {
                        this.showToast('Недостаточно прав', 'error');
                        return;
                    }
                    grade.value = grade.value.replace('.', '');
                    grade.isProvisional = false;
                    this.saveData();
                    this.showToast('Оценка переведена в разряд действительных!', 'success');
                },

                updateScheduleItem(lesson) {
                    if (this.currentUser.role !== 'owner') return;
                    this.saveData();
                    this.showToast('Расписание обновлено', 'success');
                },

                addLesson() {
                    if (this.currentUser.role !== 'owner') return;
                    const newNum = this.lessons.length + 1;
                    this.lessons.push({
                        id: 'l_' + Date.now(),
                        weekNum: newNum,
                        date: new Date().toISOString().split('T')[0],
                        dayOfWeek: 'Вторник',
                        time: '10:00 - 10:45',
                        topic: 'Новая тема урока',
                        room: 'Кабинет 305',
                        homework: 'Домашнее задание не задано',
                        homeworkDeadline: ''
                    });
                    this.saveData();
                    this.showToast('Добавлен новый урок в расписание', 'success');
                },

                deleteLesson(lessonId) {
                    if (this.currentUser.role !== 'owner') return;
                    this.lessons = this.lessons.filter(l => l.id !== lessonId);
                    this.saveData();
                    this.showToast('Урок удален из расписания', 'info');
                },

                addUser() {
                    if (this.currentUser.role !== 'owner') return;
                    const username = prompt('Введите логин нового пользователя:');
                    if (!username) return;
                    const fullName = prompt('Введите ФИО нового пользователя:');
                    if (!fullName) return;
                    const role = prompt('Введите роль (student, teacher, owner):', 'student');
                    if (!['student', 'teacher', 'owner'].includes(role)) {
                        this.showToast('Неверная роль', 'error');
                        return;
                    }
                    const password = prompt('Введите пароль:', '123456');
                    if (!password) return;

                    this.users.push({
                        id: 'u_' + Date.now(),
                        username,
                        password,
                        role,
                        fullName,
                        group: role === 'student' ? '10-А класс' : 'Персонал'
                    });
                    this.saveData();
                    this.showToast('Пользователь успешно создан!', 'success');
                },

                changeUserRole(user, newRole) {
                    if (this.currentUser.role !== 'owner') return;
                    user.role = newRole;
                    this.saveData();
                    this.showToast('Роль пользователя изменена', 'success');
                },

                deleteUser(userId) {
                    if (this.currentUser.role !== 'owner') return;
                    if (userId === this.currentUser.id) {
                        this.showToast('Нельзя удалить свой собственный аккаунт', 'error');
                        return;
                    }
                    this.users = this.users.filter(u => u.id !== userId);
                    this.saveData();
                    this.showToast('Пользователь удален', 'info');
                },

                getStudents() {
                    return this.users.filter(u => u.role === 'student');
                },

                getStudentGrades(studentId) {
                    return this.grades.filter(g => g.studentId === studentId);
                },

                getStudentFinal(studentId) {
                    const f = this.finalGrades.find(item => item.studentId === studentId);
                    return f ? f.grade : '—';
                },

                saveFinalGrade(studentId, gradeVal) {
                    if (this.currentUser.role !== 'owner' && this.currentUser.role !== 'teacher') return;
                    let f = this.finalGrades.find(item => item.studentId === studentId);
                    if (f) {
                        f.grade = gradeVal;
                    } else {
                        this.finalGrades.push({ studentId, month: 'Сентябрь 2026', grade: gradeVal });
                    }
                    this.saveData();
                    this.showToast('Итоговая оценка сохранена', 'success');
                }
            }));
        });
    </script>
</body>
</html>
